name: CI

on:
  pull_request:
  push:
    branches: [main]
  # agent 工作流用 GITHUB_TOKEN 推送不会触发 pull_request，结束后显式派发
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    # 预览要推 gh-pages 与写 PR 评论
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - run: npm run e2e
      # 改前截图：PR 时在主线上再跑一遍 e2e，放到 tests/shots-before/，预览评论里并排显示改前改后。
      # 主线版本跑不起来（比如场景是这次新加的）不算失败，只是没有对比
      - name: 改前截图
        if: success() && github.event_name != 'push' && github.ref_name != 'main'
        continue-on-error: true
        run: |
          git fetch -q --depth 1 origin main
          git worktree add -q ../base FETCH_HEAD
          cd ../base && npm ci --silent && npm run e2e > /dev/null 2>&1 || true
          mkdir -p "$GITHUB_WORKSPACE/tests/shots-before" && cp tests/shots/*.png "$GITHUB_WORKSPACE/tests/shots-before/" 2>/dev/null || true
          ls "$GITHUB_WORKSPACE/tests/shots-before" | head
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-shots
          path: tests/shots/
          retention-days: 7
      # 试玩预览（《系统架构》§4.4）：e2e 通过后发布；来自 fork 的 PR 没有写权限，跳过
      - name: 预览
        id: preview
        if: success() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: npm run build && node tools/preview.mjs deploy
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - if: success() && steps.preview.outputs.tier == 'artifact'
        uses: actions/upload-artifact@v7
        with:
          name: preview-dist
          path: dist/
          retention-days: 7
