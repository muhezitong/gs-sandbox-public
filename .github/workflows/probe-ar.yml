# 沙盒专用：验证 GITHUB_TOKEN 能否删除 action_required 运行（game-studio#64）
name: probe-ar
on:
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=action_required&per_page=50" --jq '.workflow_runs[].id')
          echo "found: $(echo $ids | wc -w)"
          for id in $ids; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" && echo "deleted $id" || echo "delete failed $id"; done
